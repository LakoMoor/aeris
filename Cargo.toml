[workspace]
resolver = "2"
members = ["crates/aeris-core", "crates/aeris-pe", "kernel", "builder"]
default-members = ["builder"]
exclude = ["tests/win-hello"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.dev]
panic = "abort"
opt-level = 2

[profile.release]
panic = "abort"
opt-level = 3
lto = true
